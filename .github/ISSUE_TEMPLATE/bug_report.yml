name: Bug report
description: The mod does something wrong, crashes, or input misbehaves
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Fill in the sections below.
        The more of this you fill in, the faster we can find the cause.

  - type: checkboxes
    id: pre-checks
    attributes:
      label: Before submitting
      description: Please confirm the following.
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I am using the latest version of the mod and LuaCs For Barotrauma.
          required: true
        - label: I have tested with other mods disabled (or listed them in "Anything else?").
          required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of what is broken.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Numbered steps so we can see it ourselves.
      placeholder: |
        1. Launch the game with the mod enabled
        2. Press RB (item wheel opens)
        3. Point at slot 3 and release RB
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect to happen?
      description: What should have happened instead.
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Your setup"

  - type: input
    id: mod-version
    attributes:
      label: Mod version
      description: See filelist.xml or the Workshop page.
      placeholder: e.g. 0.5.9
    validations:
      required: true

  - type: input
    id: luacs-version
    attributes:
      label: LuaCs For Barotrauma version
      description: In-game — Mods → LuaCs For Barotrauma, or the Workshop page.
    validations:
      required: true

  - type: input
    id: game-version
    attributes:
      label: Barotrauma version
      description: In-game — main menu, bottom left corner.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - Steam Deck
        - Other
    validations:
      required: true

  - type: input
    id: controller-model
    attributes:
      label: Controller model
      description: e.g. Xbox Series X pad / DualShock 4 / Joy-Con pair / Steam Deck built-in
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - USB
        - Bluetooth
        - Built-in
        - Other
    validations:
      required: true

  - type: dropdown
    id: steam-input
    attributes:
      label: Steam Input
      options:
        - Enabled
        - Disabled
        - Not sure
    validations:
      required: true

  - type: input
    id: steam-input-layout
    attributes:
      label: Steam Input layout template
      description: Only if Steam Input is enabled — which layout template is used?
      placeholder: e.g. Gamepad with Joystick Trackpad
    validations:
      required: false

  - type: input
    id: input-backend
    attributes:
      label: Input backend (from the mod's options window)
      description: 'The status line says e.g. "Gamepad: X (input: SDL2)" — copy it here.'
      placeholder: 'Gamepad: X (input: SDL2)'
    validations:
      required: true

  - type: textarea
    id: console-log
    attributes:
      label: Console log
      description: |
        LuaCs messages start with "GamepadInput:".
        Look in the in-game console (F3) or the server/client console window and copy
        EVERY line starting with "GamepadInput:" (initialization, backend, gyro, actions...).
      render: shell
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / video
      description: |
        Optional, but very helpful (especially for UI/wheel issues).
        You can drag & drop images right into this field.
    validations:
      required: false

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else?
      description: Other mods enabled, beta branch of the game, antivirus, etc.
    validations:
      required: false